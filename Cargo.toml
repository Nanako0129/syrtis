[workspace]
resolver = "2"
members = ["crates/tb_core_ffi", "vendor/tokscale-core"]

# One engine in the binary: `syrtis-agent` depends on tokscale-core by git
# rev, the app by path. This points that git source at the vendored checkout,
# so both use the same crate. `scripts/check_agent_engine_pin.py` checks that
# the vendor gitlink equals the rev the agent pins, so the patch never swaps
# in an engine the agent was not reviewed against.
[patch."https://github.com/Nanako0129/tokscale-core"]
tokscale-core = { path = "vendor/tokscale-core" }

[profile.release]
lto = true
strip = "debuginfo"
# This builds a staticlib called over a C ABI from Swift. A panic must not
# unwind across that boundary — since Rust 1.81 an `extern "C"` fn that unwinds
# is a defined process abort (not UB), but a whole-app abort throws away the
# per-card resilience the Swift side is built for. So rather than `panic =
# "abort"`, every FFI entry point wraps its body in `catch_unwind` (see
# `guarded` in tb_core_ffi/src/lib.rs) and turns a panic into an error envelope:
# a panic inside one report — a serde error, a bad index in a ported module, an
# `.expect()` — degrades that one card to an error and leaves the rest of the
# app running. Unwinding also makes the Mutex poison-recovery in lib.rs /
# agent_usage.rs meaningful again (a Mutex is only poisoned on unwind).

# Proc-macros and build scripts only run at build time, and stripping them
# breaks the build on Xcode 27: dyld refuses to load a stripped proc-macro
# dylib ("mis-aligned LINKEDIT string pool"), so every crate using
# serde_derive, tokio-macros and the like fails with E0463. Measured on macOS
# 27.0 with Xcode's ld-27037.1 and Homebrew rustc 1.97.1: the same
# serde_derive build loads with strip off and fails with it on, identically
# across rebuilds. The shipped staticlib is unaffected: built with this
# section, and built with strip off for the whole profile, it carried no
# __debug_ sections either way and differed by under 300 bytes.
[profile.release.build-override]
strip = false
