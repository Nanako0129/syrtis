[package]
name = "tb_core_ffi"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
# cdylib: the WinUI/C# shell loads this over P/Invoke (tb_core_ffi.dll on
# Windows, libtb_core_ffi.dylib for the macOS-side test loop). staticlib is
# what the macOS app links via SwiftPM. Keeping both here means the Windows
# repo's vendor re-sync is a byte-identical copy (no local re-apply).
crate-type = ["cdylib", "staticlib"]

[dependencies]
tokscale-core = { path = "../../vendor/tokscale-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
# Version specs mirror the Tauri app (TokenBar-tokcat/src-tauri/Cargo.toml) so
# the ported report/agent modules compile against the same dependency surface.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# Public resolver and typed TLS error surfaces used by provider diagnostics.
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy"] }
tower-service = "0.3"
rustls = { version = "0.23", default-features = false }
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
fs2 = "0.4"
tokio = { version = "1", features = ["full"] }
# `join_all` for the provider table in `agent_usage::run`. Without default
# features: 0.3.32 is already locked that way via reqwest, and the defaults
# would add `futures-macro` to a lock the Windows port vendors byte-identically.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
parking_lot = "0.12"
chrono = "0.4"
# App-data dir resolution (~/Library/Application Support) without Tauri APIs;
# same version line tokscale-core already pulls in.
dirs = "5"
rayon = "1.10"
# Read Cursor's local login store without creating or modifying the database.
rusqlite = { version = "0.32", features = ["bundled"] }
# The remote-usage agent (pairing, grants, Noise transport, caches), embedded
# by `remote_agent.rs`. Exact rev; its tokscale-core is the vendored one
# through the workspace `[patch]`.
syrtis-agent = { git = "https://github.com/Nanako0129/Syrtis-Agent", rev = "f424877dad0ff6490a0b9e011806604a0ae695d8" }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[dev-dependencies]
tempfile = "3"
# Build DSH `session.v4.jsonl.zstd` fixtures; same line tokscale-core uses.
zstd = "0.13"
