name: CI (release configuration)

# The release-configuration half of main's CI, split out of ci.yml so it runs
# beside the debug build and selftest instead of after them. Before the split a
# main push ran both halves in series in one job, about 10 minutes (run
# 36290738328: 595 s). A separate workflow rather than a second job in ci.yml
# because that job would appear on every PR as a "skipped" check, and a merge
# loop that waits for every check to pass reads a skipped one as neither.
#
# Only main pushes run it. A tag needs both this run and ci.yml's run for the
# commit green; release.yml checks that first (scripts/check_ci_gate.sh).
on:
  push:
    branches: [main]
    paths-ignore: ['landing/**']
  # Lets a branch that edits this file run it before merge (Actions tab or
  # `gh workflow run ci-release.yml --ref <branch>`) without adding a check to
  # every PR. GitHub only offers dispatch for a workflow that already exists on
  # the default branch, so this works from the first change after this file
  # lands on main.
  workflow_dispatch:

jobs:
  release:
    # Same image as ci.yml's build job; see the comment there for why xcode-27.
    runs-on: xcode-27
    steps:
      # No step after checkout needs the token: the submodule is fetched by
      # checkout itself and SwiftPM clones Sparkle anonymously.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      # Restores the dependency cache ci.yml's build job keeps (the same
      # shared-key) but never writes it: that job is the one writer, and two
      # jobs saving one key at once only race.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-with-tests
          save-if: false

      - name: Build Rust staticlib
        run: cargo build --release --locked

      # ci.yml compiles only the debug configuration, so nothing there can see a
      # `#if DEBUG` boundary break. The release configuration was first
      # compiled by scripts/bundle.sh, which only runs from release.yml on a
      # `v*` tag — so a call to a DEBUG-only symbol stayed green through local
      # gates, PR CI and merge, and failed only after the tag was already
      # pushed. PR #137 hit exactly that.
      #
      # Push-only (this workflow never runs on pull_request): this class of
      # break needs someone to touch a conditional-compilation boundary, which
      # is rare, and a release build is slow enough that paying for it on every
      # PR iteration is a bad trade. Running it on main still guarantees the tag
      # is never the first time this configuration is compiled.
      - name: Build Swift package (release configuration)
        run: swift build -c release

      # ci.yml runs only the bare executable, where
      # `Bundle.main.bundleIdentifier` is nil. A value keyed on that is literal
      # where the suite looks and something else where it ships — #146 wrote
      # three source scans against exactly that and all three were escaped,
      # because the gap is not in the source text. Running the suite from the
      # bundled binary is what observes it.
      #
      # Same push-only trade as the step above, and it reuses that release
      # build, so the marginal cost here is the bundling and one suite run.
      #
      # `SELFTEST_BUNDLE_ID=` — empty, on purpose. The Makefile defaults to a
      # throwaway identifier so a local run cannot write into the installed
      # app's preference domain, and empty here means "whatever
      # scripts/bundle.sh defaults to", which is the shipping identifier.
      #
      # That difference is the gate. A value keyed on the identifier merely
      # being non-nil is caught either way, but one keyed on the production
      # string takes the safe branch under any other identity — so the run that
      # blocks a release has to carry the real one. This runner is ephemeral and
      # has no Syrtis installed, which is what makes that safe here and not on
      # a developer's Mac.
      #
      # Empty rather than the literal: a second copy of the identifier is a
      # second place for a rename to silently weaken this into a no-op.
      - name: Selftest from the bundled release binary
        run: make selftest-bundled SELFTEST_BUNDLE_ID=
