name: CI

# The app build/test pipeline. Skips landing-only changes — those have their
# own pages.yml deploy and don't touch the Rust/Swift app.
on:
  push:
    branches: [main]
    paths-ignore: ['landing/**']
  pull_request:
    paths-ignore: ['landing/**']

# A new push to a PR branch makes its previous run's result moot, so that run is
# cancelled rather than left holding an xcode-27 runner. Pushes to main key on
# the run id and are never cancelled, so every main commit gets its own run of
# this workflow. That is half of main's gate: the release-configuration half is
# ci-release.yml, and release.yml refuses a tag unless both are green.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Xcode 27 (the macOS 27 SDK): the dashboard's glass panel is built on
    # NSStatusItem.expandedInterfaceDelegate, which older SDKs do not have.
    # macos-26 carries Xcode 26.6 and fails to compile it; compiling the panel
    # out instead would ship a release without it (see #343 in
    # GlassBackground.swift). `xcode-27` is a GitHub public-preview image as of
    # 2026-09 — expect occasional queueing.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # The knowledge checks resolve engine SHAs and count commit ranges, which
      # a depth-1 submodule cannot answer. Without this they return "cannot ask"
      # and pass silently, which is how a stale delta count reached main three
      # advances running.
      - name: Unshallow the engine submodule
        run: |
          set -euo pipefail
          if [ "$(git -C vendor/tokscale-core rev-parse --is-shallow-repository)" = "false" ]; then
            echo "engine already complete"
          else
            git -C vendor/tokscale-core fetch --unshallow --quiet
          fi
          test "$(git -C vendor/tokscale-core rev-parse --is-shallow-repository)" = "false"

      # Two knowledge checks read this repository's own history: whether the
      # last engine pin advance touched crates/tb_core_ffi or ctb.h, and
      # whether a document's body changed since the merge base with main
      # without moving last_verified. A depth-1 checkout holds neither, and
      # both checks then answer "cannot ask" and pass.
      - name: Fetch history for the knowledge checks
        run: |
          set -euo pipefail
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --unshallow --quiet origin
          fi
          git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse --is-shallow-repository)" = "false"
          git merge-base origin/main HEAD >/dev/null

      - name: Validate knowledge contracts
        run: |
          python3 scripts/check_knowledge.py --self-test
          python3 scripts/check_knowledge.py

      # Guards the misfire that reached the tag three times: notes are bound to
      # the tag by filename, so a release cannot inherit the previous version's
      # text. Build-independent, so it runs before the toolchain.
      - name: Release notes contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # A tag with no notes file must fail, not fall back.
          if GITHUB_REF_NAME=v0.0.0-absent scripts/release_notes.sh >/dev/null 2>&1; then
            echo "::error::release_notes.sh accepted a tag with no notes file"
            exit 1
          fi

          # Every committed pair must agree on its figures. The plain-text notes
          # reach the Sparkle dialog and the markdown reaches the release page;
          # a reader comparing the two should not find different numbers.
          shopt -s nullglob
          for f in release-notes/*.txt; do
            python3 scripts/check_release_notes.py "$(basename "$f" .txt)"
          done

          # The appcast renderer's escaping, run against the shipping file
          # rather than a copy of it: literal <, &, >, an escaped &lt; and ]]>.
          scripts/render_notes_html.sh --self-test

          # The tag gate release.yml runs before its build job, against a
          # fake `gh`: a regression here would otherwise surface only when a
          # real tag is refused or, worse, let through.
          scripts/check_ci_gate_test.sh

      # A PR that only changes prose needs the knowledge and release-notes
      # checks above, not a 5-minute app build. Everything below is skipped for
      # it, so the `build` check still ends green or red rather than disappearing
      # (a missing check reads as "nothing pending" to a merge loop).
      #
      # Fail-closed: only a pull_request can be docs-only, the diff must list at
      # least one file, and every file must be under docs/ or release-notes/ or
      # be a Markdown file at the repository root. Anything else, including a
      # diff that cannot be computed, runs the full build. A push to main never
      # takes this path. --no-renames lists both sides of a move, so moving a
      # source file into docs/ is not mistaken for a docs-only change.
      - name: Classify the change
        id: scope
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          docs_only=false
          if files=$(git diff --no-renames --name-only "$BASE" HEAD) && [ -n "$files" ]; then
            if ! grep -vqE '^(docs/|release-notes/|[^/]+\.md$)' <<<"$files"; then
              docs_only=true
            fi
          fi
          printf '%s\n' "$files"
          echo "docs_only=$docs_only" | tee -a "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.scope.outputs.docs_only != 'true'

      # Most PRs never touch Rust, yet rebuilt the staticlib every run: the
      # dependency cache hits, but the two workspace crates are path
      # dependencies it does not keep, and tb_core_ffi's fat LTO alone was 99 s
      # of the 129 s step (run 36272682120). So the finished library is cached
      # under a key of everything that goes into it, and a PR whose key matches
      # links the library main already built.
      #
      # Key inputs: the root manifest (it carries [profile.release]), the lock
      # file, the FFI crate, .cargo/ (MACOSX_DEPLOYMENT_TARGET), this workflow
      # (how cargo is invoked), the engine submodule's commit, and the exact
      # rustc, and the runner image version, which carries the clang that
      # compiles rusqlite's bundled C. Pushes never read this cache and always
      # build in full, so a stale library cannot survive past the merge.
      #
      # A hit also skips the Rust unit tests below, so the key covers what they
      # read as well: Fixtures/ and Tests/fixtures/ (agent_usage.rs and
      # model_report.rs load a fixture from each). Those do not change the
      # library's bytes; they are here so a fixture-only change still runs the
      # tests.
      #
      # Each part is assigned before use: a failure inside `$(...)` in the echo
      # would not trip `set -e`, and an empty engine term would let a PR that
      # only moves the submodule link the previous engine.
      - name: Rust library cache key
        if: steps.scope.outputs.docs_only != 'true'
        id: rustlib
        run: |
          set -euo pipefail
          rustc_id=$(rustc -V | shasum | cut -c1-12)
          engine=$(git rev-parse HEAD:vendor/tokscale-core)
          image="${ImageOS:?}-${ImageVersion:?}"
          echo "key=rustlib-v1-${RUNNER_OS}-${RUNNER_ARCH}-${image}-${rustc_id}-${engine}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**', '.cargo/**', '.github/workflows/ci.yml', 'Fixtures/**', 'Tests/fixtures/**') }}" >> "$GITHUB_OUTPUT"

      # PR-only. Main always builds from source: it is the only writer of this
      # cache, so reading it there would carry an entry forward instead of
      # proving the library still builds.
      #
      # The cache path must be the one main saves under: actions/cache folds
      # the path into the entry's version, and a different path never matches.
      - name: Restore Rust library
        id: rustlib-restore
        if: steps.scope.outputs.docs_only != 'true' && (github.event_name == 'pull_request')
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/rustlib/libtb_core_ffi.a
          key: ${{ steps.rustlib.outputs.key }}

      - name: Link the restored Rust library
        if: steps.scope.outputs.docs_only != 'true' && (steps.rustlib-restore.outputs.cache-hit == 'true')
        run: |
          mkdir -p target/release
          cp "$RUNNER_TEMP/rustlib/libtb_core_ffi.a" target/release/

      # Saves on main only: a PR's own entry is scoped to that PR and would only
      # evict main's entries from the 10 GB budget.
      #
      # shared-key names the entry explicitly (it replaces rust-cache's
      # key-plus-job-id part); ci-release.yml restores the same one. It was
      # renamed from the implicit `build` when the unit tests and Clippy were
      # added: rust-cache never re-saves a key that already exists, so under
      # the old name the dev/test-profile dependencies would never have been
      # stored and both steps would have compiled them cold on every run.
      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.docs_only != 'true' && (steps.rustlib-restore.outputs.cache-hit != 'true')
        with:
          shared-key: build-with-tests
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # --locked: the key names Cargo.lock, so the build must be held to it. A
      # manifest change without a regenerated lock fails here instead of being
      # resolved afresh and cached under a key that claims the old lock.
      - name: Build Rust staticlib
        if: steps.scope.outputs.docs_only != 'true' && (steps.rustlib-restore.outputs.cache-hit != 'true')
        run: cargo build --release --locked

      # The Rust unit tests and Clippy, on every run that builds Rust: a PR
      # whose Rust inputs or the fixtures its tests read changed (a cache hit
      # means neither did, so both are skipped with the build; see the key
      # above) and every push to main. Until now they
      # ran only as local gates (docs/knowledge/verification.md). Measured on
      # runs 36313333899 and 36317158008: test 94-103 s and clippy 52-54 s
      # with a cold dev/test profile, 33 s and 8 s once rust-cache holds it.
      #
      # Clippy reports warnings without failing on them: tb_core_ffi had 12 lib
      # and 19 lib-test warnings on run 36320004486, so `-D warnings` would
      # turn CI red before any change. What fails here is an error-level lint,
      # which includes Clippy's deny-by-default correctness group.
      #
      # tb_core_ffi only: vendor/tokscale-core declares `#![deny(clippy::all)]`
      # and the toolchain is the floating stable, so a new Rust release adding
      # a lint the engine trips would turn every PR and main red at once, and
      # the tag gate would then hold releases on code nobody here changed. The
      # engine's lints stay with the local gate (`cargo clippy --workspace
      # --all-targets`) and with the upstream sync.
      #
      # `-p` alone does not do that: the engine is a path dependency and a
      # workspace member, so cargo does not cap its lints, and Clippy still
      # lints its lib target. `--no-deps` does. Measured with clippy 1.97.1: a
      # needless `return` injected into the engine failed `-p tb_core_ffi`
      # (exit 101) and passed with `--no-deps`; an `x == x` (eq_op, deny by
      # default) injected into tb_core_ffi still failed with `--no-deps`.
      - name: Rust unit tests
        if: steps.scope.outputs.docs_only != 'true' && (steps.rustlib-restore.outputs.cache-hit != 'true')
        run: cargo test -p tb_core_ffi --locked

      - name: Clippy
        if: steps.scope.outputs.docs_only != 'true' && (steps.rustlib-restore.outputs.cache-hit != 'true')
        run: cargo clippy -p tb_core_ffi --all-targets --locked --no-deps

      # The copy main saves is taken here, from this exact cargo invocation.
      - name: Stage Rust library for the cache
        if: steps.scope.outputs.docs_only != 'true' && (github.event_name == 'push')
        run: |
          mkdir -p "$RUNNER_TEMP/rustlib"
          cp target/release/libtb_core_ffi.a "$RUNNER_TEMP/rustlib/"

      - name: Check for an existing Rust library entry
        id: rustlib-exists
        if: steps.scope.outputs.docs_only != 'true' && (github.event_name == 'push')
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/rustlib/libtb_core_ffi.a
          key: ${{ steps.rustlib.outputs.key }}
          lookup-only: true

      - name: Build Swift package
        if: steps.scope.outputs.docs_only != 'true'
        run: swift build

      - name: Core logic selftest
        if: steps.scope.outputs.docs_only != 'true'
        # Pace copy and Format's date output are localized, and several
        # assertions compare against the English text. Pin the language so the
        # result never depends on the runner's locale.
        run: swift run Syrtis --selftest -AppleLanguages "(en)"

      - name: FFI smoke test
        if: steps.scope.outputs.docs_only != 'true'
        run: swift run Syrtis --smoke

      # Last, so only a main commit that passed every step above — build,
      # selftest and smoke test — can publish the library PRs will link. The
      # release-configuration gate runs beside this job, in ci-release.yml; the
      # library bytes do not depend on its outcome.
      - name: Save Rust library
        if: steps.scope.outputs.docs_only != 'true' && (github.event_name == 'push' && steps.rustlib-exists.outputs.cache-hit != 'true')
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/rustlib/libtb_core_ffi.a
          key: ${{ steps.rustlib.outputs.key }}
